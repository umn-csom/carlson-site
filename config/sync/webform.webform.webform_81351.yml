elements: |
  waiver:
    '#type': processed_text
    '#format': full_html
    '#text': "<div class='bg-lt-grey pad border'><p><em><strong>Waiver</strong></em></p><p><em>By submitting my photo or video to this contest, I release my study abroad photographs and/or permit the use of my likeness in photographs and videos by the Carlson Global Institute at the University of Minnesota Carlson School of Management. I understand and accept that the Carlson Global Institute may duplicate them for use in printed and electronic materials, including the Program Catalog, the Carlson Global Institute &amp; Education Abroad websites, videos, brochures, posters, flyers, announcements, social media, and/or other publications. I understand and accept that the excerpts may be accompanied by my full name and study abroad program, and may be edited for length and clarity. If I want the Carlson Global Institute to discontinue use of my likeness and quotes, I understand and accept that I may request discontinuation of future use, not discontinuation of already existing materials, through a written request to the Carlson Global Institute.</em></p></div>"
    '#title': "Waiver"
    '#description': ""
