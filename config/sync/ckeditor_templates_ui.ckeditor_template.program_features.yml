html:
  value: '<div class="program-features"><div class="program-features__item"><div class="program-features__item__img"><drupal-media data-entity-type="media" data-entity-uuid="980d5802-bb47-4341-ac26-75582703d572" data-align="center">&nbsp;</drupal-media></div><div class="program-features__item__text"><div class="program-features__item__title">Start date</div><div>Fall (September)</div></div></div><div class="program-features__item"><div class="program-features__item__img"><drupal-media data-entity-type="media" data-entity-uuid="c5a15e20-5755-443f-aed3-a5fe3a703b54" data-align="center">&nbsp;</drupal-media></div><div class="program-features__item__text"><div class="program-features__item__title">Duration</div><div>2-years</div></div></div><div class="program-features__item"><div class="program-features__item__img"><drupal-media data-entity-type="media" data-entity-uuid="fc04863c-ac55-4b03-a041-ff4b63fbb84a" data-align="center">&nbsp;</drupal-media></div><div class="program-features__item__text"><div class="program-features__item__title"><a href="/resources/course-modalities">Format</a></div><div>On-Campus</div></div></div><div class="program-features__item"><div class="program-features__item__img"><drupal-media data-entity-type="media" data-entity-uuid="c584ad94-47af-494e-b6b9-36b8d05eb06a" data-align="center">&nbsp;</drupal-media></div><div class="program-features__item__text"><div class="program-features__item__title">Work experience</div><div>Average five years</div></div></div></div><div class="program-features__text"><p>We offer&nbsp;<a href="https://carlsonschool.umn.edu/resources/course-modalities">several different course formats</a>&nbsp;within our traditional fall, spring, and summer semesters. Most of the classes are offered in the evening during the week and&nbsp;on Saturdays. You&nbsp;can spend less time traveling to and from school by taking most of your courses online&nbsp;and in condensed formats.&nbsp;</p></div><div class="program-features__btn-wrapper"><a class="program-features__btn" href="https://carlsonschool.umn.edu/degrees/master-business-administration/full-time-mba/academic-experience">View the curriculum</a></div>'
