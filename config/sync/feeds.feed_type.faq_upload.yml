label: 'FAQ Upload'
id: faq_upload
description: 'Upload a CSV to create FAQ Taxonomy items.'
help: ''
import_period: -1
import_period_per_feed: false
fetcher: upload
fetcher_configuration:
  allowed_extensions: 'txt csv tsv xml opml'
  directory: 'public://feeds'
parser: csv
parser_configuration:
  delimiter: ','
  no_headers: false
  line_limit: 100
processor: 'entity:taxonomy_term'
processor_configuration:
  values:
    vid: faq_questions
  langcode: en
  insert_new: 1
  update_existing: 0
  update_non_existent: _keep
  skip_hash_check: false
  skip_validation: false
  skip_validation_types: {  }
  authorize: false
  revision: false
  expire: -1
  owner_feed_author: false
  owner_id: 0
custom_sources:
  program:
    value: Program
    label: Program
    machine_name: program
    type: csv
  topic:
    value: Topic
    label: Topic
    machine_name: topic
    type: csv
  new_question_to_review:
    value: 'New Question To Review'
    label: 'New Question To Review'
    machine_name: new_question_to_review
    type: csv
  questions:
    value: Questions
    label: Questions
    machine_name: questions
    type: csv
  answers:
    value: Answers
    label: Answers
    machine_name: answers
    type: csv
  id:
    value: id
    label: id
    machine_name: id
    type: csv
  answer_html:
    value: 'Answer HTML'
    label: 'Answer HTML'
    machine_name: answer_html
    type: csv
  html_answers:
    value: 'HTML Answers'
    label: 'HTML Answers'
    machine_name: html_answers
    type: csv
  page:
    value: Page
    label: Page
    machine_name: page
    type: csv
