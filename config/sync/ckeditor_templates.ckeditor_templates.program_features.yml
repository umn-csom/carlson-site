code: "<div class=\"program-features\">\r\n    <div class=\"program-features__item\">\r\n        <div class=\"program-features__item__img\">\r\n            <drupal-media data-entity-type=\"media\" data-entity-uuid=\"980d5802-bb47-4341-ac26-75582703d572\" data-align=\"center\">&nbsp;</drupal-media>\r\n        </div>\r\n        <div class=\"program-features__item__text\">\r\n            <div class=\"program-features__item__title\">\r\n                Start date\r\n            </div>\r\n            <div>\r\n                Fall (September)\r\n            </div>\r\n        </div>\r\n    </div>\r\n    <div class=\"program-features__item\">\r\n        <div class=\"program-features__item__img\">\r\n            <drupal-media data-entity-type=\"media\" data-entity-uuid=\"c5a15e20-5755-443f-aed3-a5fe3a703b54\" data-align=\"center\">&nbsp;</drupal-media>\r\n        </div>\r\n        <div class=\"program-features__item__text\">\r\n            <div class=\"program-features__item__title\">\r\n                Duration\r\n            </div>\r\n            <div>\r\n                2-years\r\n            </div>\r\n        </div>\r\n    </div>\r\n    <div class=\"program-features__item\">\r\n        <div class=\"program-features__item__img\">\r\n            <drupal-media data-entity-type=\"media\" data-entity-uuid=\"fc04863c-ac55-4b03-a041-ff4b63fbb84a\" data-align=\"center\">&nbsp;</drupal-media>\r\n        </div>\r\n        <div class=\"program-features__item__text\">\r\n            <div class=\"program-features__item__title\">\r\n                <a href=\"/resources/course-modalities\">Format</a>\r\n            </div>\r\n            <div>\r\n                On-Campus\r\n            </div>\r\n        </div>\r\n    </div>\r\n    <div class=\"program-features__item\">\r\n        <div class=\"program-features__item__img\">\r\n            <drupal-media data-entity-type=\"media\" data-entity-uuid=\"c584ad94-47af-494e-b6b9-36b8d05eb06a\" data-align=\"center\">&nbsp;</drupal-media>\r\n        </div>\r\n        <div class=\"program-features__item__text\">\r\n            <div class=\"program-features__item__title\">\r\n                Work experience\r\n            </div>\r\n            <div>\r\n                Average five years\r\n            </div>\r\n        </div>\r\n    </div>\r\n</div>\r\n<div class=\"program-features__text\">\r\n    <p>\r\n        We offer&nbsp;<a href=\"https://carlsonschool.umn.edu/resources/course-modalities\">several different course formats</a>&nbsp;within our traditional fall, spring, and summer semesters. Most of the classes are offered in the evening during the week and&nbsp;on Saturdays. You&nbsp;can spend less time traveling to and from school by taking most of your courses online&nbsp;and in condensed formats.&nbsp;\r\n    </p>\r\n</div>\r\n<div class=\"program-features__btn-wrapper\">\r\n    <a class=\"btn btn-primary\" href=\"https://carlsonschool.umn.edu/degrees/master-business-administration/full-time-mba/academic-experience\">View the curriculum</a>\r\n</div>"
