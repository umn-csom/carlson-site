uuid: 21bc9d2c-291b-4e7c-b5b6-171739fe0bc1
langcode: en
status: true
dependencies:
  config:
    - filter.format.rich_text
  module:
    - ckeditor5
format: rich_text
editor: ckeditor5
settings:
  toolbar:
    items:
      - bold
      - italic
      - strikethrough
      - superscript
      - subscript
      - removeFormat
      - alignment
      - '|'
      - link
      - anchor
      - '|'
      - bulletedList
      - numberedList
      - '|'
      - blockQuote
      - insertTable
      - horizontalLine
      - drupalMedia
      - '|'
      - heading
      - codeBlock
      - style
      - ckeditorTemplates
      - '|'
      - sourceEditing
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - justify
        - left
        - right
    ckeditor5_codeBlock:
      languages:
        -
          label: 'Plain text'
          language: plaintext
        -
          label: C
          language: c
        -
          label: 'C#'
          language: cs
        -
          label: C++
          language: cpp
        -
          label: CSS
          language: css
        -
          label: Diff
          language: diff
        -
          label: HTML
          language: html
        -
          label: Java
          language: java
        -
          label: JavaScript
          language: javascript
        -
          label: PHP
          language: php
        -
          label: Python
          language: python
        -
          label: Ruby
          language: ruby
        -
          label: TypeScript
          language: typescript
        -
          label: XML
          language: xml
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_list:
      properties:
        reversed: true
        startIndex: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags: {  }
    ckeditor5_style:
      styles:
        -
          label: 'H2 with yellow underline'
          element: '<h2 class="label-border yellow">'
        -
          label: 'H3 with yellow underline'
          element: '<h3 class="label-border yellow">'
        -
          label: 'Paragraph with red underline'
          element: '<p class="label-border red">'
        -
          label: 'Paragraph with yellow underline'
          element: '<p class="label-border yellow">'
        -
          label: 'Maroon Button'
          element: '<a class="btn btn-primary">'
        -
          label: 'Gold Button'
          element: '<a class="btn btn-secondary">'
        -
          label: 'Gold Button (md)'
          element: '<a class="btn btn-secondary btn-md">'
        -
          label: 'Gold Outline Button'
          element: '<a class="btn btn-outline-secondary">'
    ckeditor_templates_plugin:
      replace_content: false
    editor_advanced_link_link:
      enabled_attributes:
        - aria-label
        - class
        - id
        - rel
        - target
        - title
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
    media_media:
      allow_view_mode_override: true
image_upload:
  status: false
