id: grow_north_newsletter
title: 'Grow North Newsletter'
description: 'Grow North Newsletter Signup Form'
category: ''
elements: |-
  markup:
    '#type': webform_markup
    '#markup': |
      <h4 class="text-align-center">Stay connected through the Grow North newsletter</h4>

      <p class="text-align-center">Sign up to receive news and updates on events from Grow North as well as news from the food and agriculture community in Minnesota.</p>
  email_address:
    '#type': email
    '#title': 'Email Address'
    '#title_display': invisible
    '#placeholder': 'Email Address'
    '#required': true
    '#required_error': 'Email is required'
    '#attributes':
      class:
        - newsletter-email
  captcha:
    '#type': captcha
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Sign Up'
    '#submit__attributes':
      class:
        - newsletter-submit
    '#update__attributes':
      class:
        - newsletter-submit
css: ".newsletter-form {\r\n    justify-content: center;\r\n    margin-bottom: 5rem;\r\n}\r\n\r\n.newsletter-form .js-form-type-webform-markup {\r\n    flex: 0 0 100%;\r\n}\r\n\r\n.newsletter-form .js-form-type-email {\r\n    flex: 0 0 250px;\r\n    width: 250px;\r\n}\r\n\r\n.newsletter-form .js-form-type-email .newsletter-email {\r\n    margin-top: 0.25rem;\r\n    height: 4.5rem;\r\n}\r\n\r\n\r\n.newsletter-form #edit-actions {\r\n    flex: 0 0 150px;\r\n    width:  150px;\r\n}\r\n\r\n.newsletter-form  #edit-actions .newsletter-submit {\r\n    margin-top: 0rem;\r\n    line-height: 2.4rem;\r\n    padding: 1rem 1.5rem;\r\n    font-size: 1.6rem;\r\n    text-transform: uppercase;\r\n    transition: all 0.3s ease-in-out;\r\n    display: inline-block;\r\n    font-size: 1.6rem;\r\n    display: inline-block;\r\n    font-weight: bold;\r\n    border-color: #FFCC33;\r\n    border-style: solid;\r\n    border-width: 2px;\r\n    color: #363230;\r\n    background-color: transparent;\r\n}\r\n\r\n.newsletter-form  #edit-actions .newsletter-submit:hover {\r\n    text-decoration: none;\r\n    background: #FFCC33;\r\n    box-shadow: 0 15px 30px 0 rgba(0, 0, 0, 0.2);\r\n    color: white;\r\n}"
