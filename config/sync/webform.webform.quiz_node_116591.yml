css: |
  /* Improve accessibility of radio and checkbox options */
  .quiz--answer {
    position: relative;
    text-align: center;
  }

  .quiz--answer input[type="radio"],
  .quiz--answer input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    z-index: -1;
  }

  .quiz--answer label {
    display: block;
    width: 100%;
    position: relative;
    padding: 1rem;
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 4px;
    background-color: transparent;
    text-align: center;
  }

  /* Center options in stacked layout */
  .stacked .quiz--answer {
    margin: 0 auto;
    max-width: 90%;
  }

  /* Center options in three-column layout */
  .three_cols .quiz--answer {
    display: flex;
    justify-content: center;
  }

  /* Focus ring for keyboard navigation */
  .quiz--answer input[type="radio"]:focus + label,
  .quiz--answer input[type="checkbox"]:focus + label {
    outline: none;
    border-color: #80bdff;
    box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
  }

  /* Persistent visual indicator for selected options */
  .quiz--answer input[type="radio"]:checked + label,
  .quiz--answer input[type="checkbox"]:checked + label {
    background-color: rgba(122, 0, 25, 0.1); /* Light maroon to match Carlson branding */
    border-color: #7a0019; /* Maroon color for Carlson School */
  }

  /* Make icons non-interactive */
  .quiz--answer label img {
    pointer-events: none;
  }

  /* Center content inside labels */
  .quiz--answer label img {
    display: block;
    margin: 0.5rem auto;
  }
