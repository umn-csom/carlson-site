id: olmaba_landing_page_request_form
title: 'Landing Page Request Information: Online MABA'
description: '<p>New form for the MABA program relaunched in 2024</p>'
categories: {  }
elements: |-
  markup:
    '#type': webform_markup
    '#admin_title': Title
    '#markup': '<h2 style="font-size:2.4rem;" id="form"><strong>Request information</strong></h2><p>Complete this form to receive information about coursework, admissions, tuition, and more.</p><p style="font-size:1.2rem;">*Required information</p>'
  firstname:
    '#type': textfield
    '#title': 'First Name'
    '#placeholder': 'First Name'
    '#required': true
    '#required_error': 'Please enter your first name'
  lastname:
    '#type': textfield
    '#title': 'Last Name'
    '#placeholder': 'Last Name'
    '#required': true
    '#required_error': 'Please enter your last name'
  email:
    '#type': email
    '#title': Email
    '#placeholder': Email
    '#required': true
    '#required_error': 'Please enter your email address'
  phone:
    '#type': tel
    '#title': Phone
    '#placeholder': 'Mobile Phone'
    '#required': true
    '#required_error': 'Please enter a valid phone number'
  zip:
    '#type': textfield
    '#title': 'Postal Code'
    '#placeholder': 'Postal Code'
    '#required': true
  program:
    '#type': hidden
    '#title': Program
    '#default_value': MABA
  visitorid:
    '#type': hidden
    '#title': visitorid
  clientid:
    '#type': hidden
    '#title': clientid
  quickcapturejs:
    '#type': processed_text
    '#text': |-
      <script type="text/javascript"  src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
      <script>
      	jQuery.getScript( "//cdn.jsdelivr.net/npm/js-cookie@2/src/js.cookie.min.js", function() {
      		if(Cookies.get(Object.keys(Cookies.get()).filter(function(k){ return ~k.indexOf("_ga") })[0]).length > 0) {
      			document.getElementsByName('clientid')[0].value = Cookies.get(Object.keys(Cookies.get()).filter(function(k){ return ~k.indexOf("_ga") })[0]).split('.')[2];
      		}
      		if(Cookies.get(Object.keys(Cookies.get()).filter(function(k){ return ~k.indexOf("_pk_id") })[0]).length > 0) {
      			document.getElementsByName('visitorid')[0].value = Cookies.get(Object.keys(Cookies.get()).filter(function(k){ return ~k.indexOf("_pk_id") })[0]).split('.')[0];
      		}
      	});
      </script>
    '#format': full_html
  disclosure:
    '#type': webform_markup
    '#wrapper_attributes':
      class:
        - small
      style: 'order:1'
    '#admin_title': 'Wiley Disclosure'
    '#markup': '<hr><p><sup>By submitting this form, I am agreeing that the Carlson School and its agent, </sup><a href="https://carlsonschool.umn.edu/risepoint-partnership"><sup>Risepoint</sup></a><sup>, may email me or contact me regarding educational services by telephone and/or text message utilizing automated technology or a pre-recorded message at the telephone number provided above. I understand this consent is not a condition to attend the Carlson School. </sup><a href="https://privacy.umn.edu/"><sup>University of Minnesota privacy statement</sup></a><sup>. </sup><a href="https://policies.risepoint.com/privacy-main/"><sup>Risepoint privacy policy.</sup></a><sup> </sup><a href="/node/129371"><sup>Carlson School Privacy notice.</sup></a></p>'
