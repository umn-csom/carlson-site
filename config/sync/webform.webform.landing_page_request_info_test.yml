id: landing_page_request_info_test
title: 'Landing Page Request Information: MS Supply Chain Management TEST 202501'
description: '<p>Form for testing new fields and integrations with SMC and Slate</p>'
categories: {  }
elements: |-
  markup:
    '#type': webform_markup
    '#admin_title': Title
    '#markup': |-
      <h2 style="font-size: 2.4rem; font-weight: bold">Request information</h2>

      <p>Complete this form to receive information about coursework, admissions, tuition, and more.</p>

      <p style="font-size: 1.2rem">*Required information</p>
  firstname:
    '#type': textfield
    '#title': 'First Name'
    '#placeholder': 'First Name'
    '#required': true
    '#required_error': 'Please enter your first name'
  lastname:
    '#type': textfield
    '#title': 'Last Name'
    '#placeholder': 'Last Name'
    '#required': true
    '#required_error': 'Please enter your last name'
  work_experience:
    '#type': select
    '#title': 'Work Experience'
    '#options':
      undergraduate: 'Current undergraduate student'
      0-2: '0-2 years full-time experience'
      2+: '2+ years full-time experience'
  email:
    '#type': email
    '#title': Email
    '#placeholder': Email
    '#required': true
    '#required_error': 'Please enter your email address'
  phone:
    '#type': tel
    '#title': Phone
    '#placeholder': 'Mobile Phone'
    '#required': true
    '#required_error': 'Please enter a valid phone number'
  zip:
    '#type': textfield
    '#title': 'Postal Code'
    '#placeholder': 'Postal Code'
    '#required': true
  program:
    '#type': hidden
    '#title': Program
    '#default_value': UNDECIDED
  visitorid:
    '#type': hidden
    '#title': visitorid
  clientid:
    '#type': hidden
    '#title': clientid
  disclosure:
    '#type': webform_markup
    '#markup': '<p><sub>By submitting this form, I am agreeing that the Carlson School may contact me by phone and SMS text at the telephone number provided. I understand this consent is not a condition to attend the Carlson School. </sub><a href="https://privacy.umn.edu/"><sub>Privacy statement.</sub></a> <a href="/node/129371"><sub>Privacy Notice</sub></a><sub>.</sub></p>'
  i_am_an:
    '#type': select
    '#title': 'I am an'
    '#options':
      international: 'International student'
      military: 'U.S. military member or veteran'
  program_format:
    '#type': radios
    '#title': 'I am interested in'
    '#options':
      'MS in Finance': 'MS in Finance'
      'MS Finance - Research': 'MS in Finance Research Track'
  utm_source:
    '#type': hidden
    '#title': 'UTM Source'
    '#prepopulate': true
  utm_medium:
    '#type': hidden
    '#title': 'UTM Medium'
    '#prepopulate': true
  utm_term:
    '#type': hidden
    '#title': 'UTM Term'
    '#prepopulate': true
  utm_content:
    '#type': hidden
    '#title': 'UTM Content'
    '#prepopulate': true
  utm_campaign:
    '#type': hidden
    '#title': 'UTM Campaign'
    '#prepopulate': true
  interest:
    '#type': hidden
    '#title': interest
    '#default_value': 'on-demand video'
  subscriberid:
    '#type': hidden
    '#title': subscriberid
    '#prepopulate': true
  referralurl:
    '#type': hidden
    '#title': referralUrl
