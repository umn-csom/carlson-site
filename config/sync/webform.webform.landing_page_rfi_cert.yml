id: landing_page_rfi_cert
title: 'Landing Page Request Information: Certificates'
description: ''
category: ''
elements: |-
  markup:
    '#type': webform_markup
    '#admin_title': Title
    '#markup': |-
      <h2 style="font-size: 2.4rem; font-weight: bold">Request information</h2>

      <p>Complete this form to receive information about coursework, admissions, tuition, and more.</p>

      <p style="font-size: 1.2rem">*Required information</p>
  program:
    '#type': select
    '#title': 'I''m Interested In a Certificate in'
    '#options':
      'Corporate Financial Management': 'Corporate Financial Management'
      'Entrepreneurship & Innovation': 'Entrepreneurship & Innovation'
      'Leadership for Managers': 'Leadership for Managers'
      'Medical Industry': 'Medical Industry'
      'Strategic Management': 'Strategic Management'
      'Strategic Marketing': 'Strategic Marketing'
      'Supply Chain Management for the Medical and Health Sector': 'Supply Chain Management for the Medical and Health Sector'
      Taxation: Taxation
      'International Taxation': 'International Taxation'
      'Closely-Held Business Taxation': 'Closely-Held Business Taxation'
      'Tax Executives': 'Tax Executives'
      'High-Net Worth Individual Taxation': 'High-Net Worth Individual Taxation'
    '#empty_option': '- Select Certificate -'
    '#required': true
    '#wrapper_attributes':
      class:
        - form-full-width
  firstname:
    '#type': textfield
    '#title': 'First Name'
    '#placeholder': 'First Name'
    '#required': true
    '#required_error': 'Please enter your first name'
  lastname:
    '#type': textfield
    '#title': 'Last Name'
    '#placeholder': 'Last Name'
    '#required': true
    '#required_error': 'Please enter your last name'
  email:
    '#type': email
    '#title': Email
    '#placeholder': Email
    '#required': true
    '#required_error': 'Please enter your email address'
  phone:
    '#type': tel
    '#title': Phone
    '#placeholder': 'Mobile Phone'
    '#required': true
    '#required_error': 'Please enter a valid phone number'
  country:
    '#type': select
    '#title': Country
    '#options': country_codes_us_first_
    '#required': true
  zip:
    '#type': textfield
    '#title': 'Postal Code'
    '#placeholder': 'Postal Code'
    '#required': true
  visitorid:
    '#type': hidden
    '#title': visitorid
  clientid:
    '#type': hidden
    '#title': clientid
  quickcapturejs:
    '#type': processed_text
    '#text': |-
      <script type="text/javascript"  src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
      <script>
      	jQuery.getScript( "//cdn.jsdelivr.net/npm/js-cookie@2/src/js.cookie.min.js", function() {
      		if(Cookies.get(Object.keys(Cookies.get()).filter(function(k){ return ~k.indexOf("_ga") })[0]).length > 0) {
      			document.getElementsByName('clientid')[0].value = Cookies.get(Object.keys(Cookies.get()).filter(function(k){ return ~k.indexOf("_ga") })[0]).split('.')[2];
      		}
      		if(Cookies.get(Object.keys(Cookies.get()).filter(function(k){ return ~k.indexOf("_pk_id") })[0]).length > 0) {
      			document.getElementsByName('visitorid')[0].value = Cookies.get(Object.keys(Cookies.get()).filter(function(k){ return ~k.indexOf("_pk_id") })[0]).split('.')[0];
      		}
      	});
      </script>
    '#format': full_html
  allow_sms_content:
    '#type': checkbox
    '#title': 'Allow SMS Content'
    '#description': 'I authorize the Carlson School of Management and its representatives to contact me via SMS. <a href="https://policies.edusites.net/terms">Terms</a>.'
    '#title_display': none
    '#description_display': after
  disclosure:
    '#type': webform_markup
    '#wrapper_attributes':
      class:
        - small
      style: 'order: 1'
    '#admin_title': 'Wiley Disclosure'
    '#markup': '<p>The Carlson School partners with Wiley University Services to help support your education journey. Wiley will contact you shortly in response to your request for information. <a href="https://carlsonschool.umn.edu/wiley-partnership" target="_blank">Learn more about Wiley and their privacy policy</a>.</p>'
