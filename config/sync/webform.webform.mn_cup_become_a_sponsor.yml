  would_the_funds_for_your_sponsorship_or_grant_come_from_a_corpor:
    '#type': textfield
    '#title': 'Would the funds for your sponsorship or grant come from a corporate budget or a foundation?'
    '#required': true
  are_you_the_decision_maker_budget_owner_for_the_allocation_of_th:
    '#type': webform_buttons
    '#title': 'Are you the decision maker/ budget owner for the allocation of these funds?'
    '#options': yes_no
    '#required': true
  if_no_please_share_the_name_title_of_that_person_within_your_org:
    '#type': textfield
    '#title': 'If no, please share the name & title of that person within your organization.'
    '#states':
      visible:
        ':input[name="are_you_the_decision_maker_budget_owner_for_the_allocation_of_th"]':
          value: 'No'
    '#required': true
  which_of_mn_cup_s_nine_divisions_are_you_most_interested_in_supp:
    '#type': radios
    '#title': 'Which of MN Cup’s Nine Divisions are you most interested in supporting?'
    '#options':
      'Education & Training': 'Education & Training'
      Energy/Cleantech/Water: Energy/Cleantech/Water
      Food/Agriculture/Beverage: Food/Agriculture/Beverage
      General: General
      'High Tech': 'High Tech'
      'Impact Ventures': 'Impact Ventures'
      'Life Science/Health IT': 'Life Science/Health IT'
      Student: Student
      Youth: Youth
    '#required': true
  if_your_primary_division_of_interest_does_not_have_capacity_is_t:
    '#type': radios
    '#title': 'If your primary division of interest does not have capacity, is there a second division you’d be interested in sponsoring?'
    '#options':
      'Education & Training': 'Education & Training'
      Energy/Cleantech/Water: Energy/Cleantech/Water
      Food/Agriculture/Beverage: Food/Agriculture/Beverage
      General: General
      'High Tech': 'High Tech'
      'Impact Ventures': 'Impact Ventures'
      'Life Science/Health IT': 'Life Science/Health IT'
      Student: Student
      Youth: Youth
      'N/A - I’m only interested in sponsoring if my primary division of interest has a need': 'N/A - I’m only interested in sponsoring if my primary division of interest has a need'
    '#required': true
  are_there_any_primary_benefits_of_sponsorship_that_it_would_be_i:
    '#type': checkboxes
    '#title': 'Are there any primary benefits of sponsorship that it would be important for your organization to receive or have access to in exchange for sponsoring? (select as many as apply)'
    '#options':
      'Brand Recognition  -  Logo placement in relevant media & materials': 'Brand Recognition  -  Logo placement in relevant media & materials'
      'Division Judge Role': 'Division Judge Role'
      'Grand Prize Review Board Role': 'Grand Prize Review Board Role'
      'Access to exclusive events with entrepreneurs': 'Access to exclusive events with entrepreneurs'
      'Volunteer opportunities for employees': 'Volunteer opportunities for employees'
      'Speaking or award presentation opportunities for key executives': 'Speaking or award presentation opportunities for key executives'
    '#required': true
  do_you_have_a_sense_of_the_level_of_funds_you_d_be_interested_in:
    '#type': radios
    '#title': 'Do you have a sense of the level of funds you’d be interested in contributing?'
    '#options':
      '< $10,000': '< $10,000'
      '$10,000': '$10,000'
      '$25,000': '$25,000'
      '$50,000': '$50,000'
      '$75,000 or greater': '$75,000 or greater'
      'I don’t know - would like more information before I share': 'I don’t know - would like more information before I share'
    '#required': true
  is_there_anything_our_team_should_know_about_your_organization_s:
    '#type': textarea
    '#title': 'Is there anything our team should know about your organization’s priorities, mission alignment or primary goals for sponsorship/ grants? '
  how_did_you_hear_about_mn_cup_:
    '#type': textfield
    '#title': 'How did you hear about MN Cup?'
    '#required': true
