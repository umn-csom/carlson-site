name: "Carlson Refresh"
type: theme
description: "Carlson Refresh theme"
core_version_requirement: ^8 || ^9 || ^10
base theme: bootstrap_barrio

libraries:
  - carlson_refresh/slick
  - carlson_refresh/global-styling
  - carlson_refresh/global-scripts
  - carlson_refresh/unbounce

libraries-extend:
  contextual/drupal.contextual-links:
    - carlson_refresh/contextual
  views_ui/admin.styling:
    - carlson_refresh/views-ui
  charts_highcharts/highcharts:
    - carlson_refresh/charts-highcharts
  node/drupal.node.preview:
    - carlson_refresh/drupal.node.preview
  course_comparison_table/course_comparison_table_code:
    - carlson_refresh/comparison-table
  webform/webform.element.help:
    - carlson_refresh/webform.element.help

libraries-override:
  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: false
  bootstrap_barrio/global-styling:
    css:
      component:
        # Disable all components from base theme.
        css/components/affix.css: false
        css/components/book.css: false
        css/components/contextual.css: false
        css/components/feed-icon.css: false
        css/components/field.css: false
        css/components/header.css: false
        css/components/help.css: false
        css/components/icons.css: false
        css/components/image-button.css: false
        css/components/item-list.css: false
        css/components/list-group.css: false
        css/components/media.css: false
        css/components/page.css: false
        css/components/search-form.css: false
        css/components/shortcut.css: false
        css/components/sidebar.css: false
        css/components/site-footer.css: false
        css/components/skip-link.css: false
        css/components/table.css: false
        css/components/tabledrag.css: false
        css/components/tableselect.css: false
        css/components/tablesort-indicator.css: false
        css/components/ui.widget.css: false
        css/components/tabs.css: false
        css/components/toolbar.css: false
        css/components/user.css: false
        css/components/vertical-tabs.css: false
        css/components/views.css: false
        css/components/ui-dialog.css: false
        css/components/progress.css: false
      theme:
        css/print.css: {}
  bootstrap_barrio/dropbutton:
    css:
      component:
        css/components/dropbutton.component.css: false
        css/components/dropbutton.css: css/components/dropbutton.css
  bootstrap_barrio/drupal.node.preview:
    css:
      component:
        css/components/node-preview.css: false
  bootstrap_barrio/comments:
    css:
      component:
        css/components/comments.css: css/components/comments.scss
  bootstrap_barrio/book-navigation:
    css:
      component:
        css/components/book-navigation.css: css/components/book-navigation.scss
  bootstrap_barrio/tabs:
    css:
      component:
        css/components/tabs.css: false
  responsive_menu/responsive_menu.styling:
    css:
      theme:
        css/responsive_menu.css: false
  responsive_menu/responsive_menu.mmenu:
    css:
      theme:
        /libraries/mmenu/dist/mmenu.css: css/mmenu.css
  datatables/datatables_core:
    css:
      component:
        /libraries/datatables/media/css/jquery.dataTables.css: css/jquery.dataTables.css
  umn_search/cse_library:
    css:
      theme:
        css/umn-search-form.css: false

ckeditor_stylesheets:
  - https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap
  - css/style.css
  - css/components/ckeditor.css

ckeditor5-stylesheets:
  - css/components/ckeditor.css

regions:
  top_header: "Top Header"
  header: "Header"
  navbar_primary: "Primary menu"
  navbar_secondary: "Secondary menu"
  local_tasks: "Local tasks"
  page_top: "Page top"
  page_bottom: "Page bottom"
  highlighted: "Highlighted"
  featured_top: "Featured top"
  breadcrumb: "Breadcrumb"
  page_title: "Page Title"
  content: "Content"
  sticky_sidebar: "Node Sticky Sidebar"
  inner_nav: "Node Inner Nav (TEMP CTA SOLUTION)"
  node_top: "Node Content Top"
  node_content: "Node Content"
  node_middle: "Node Middle"
  node_bottom: "Node Content Bottom"
  node_bottom_left: "Node Bottom Left"
  node_bottom_right: "Node Bottom Right"
  footer_first: "Footer first"
  footer_second: "Footer second"
  footer_third: "Footer third"
  footer_fourth: "Footer fourth"

