carlson_styleguide.buttons:
  path: '/styleguide/buttons'
  defaults:
    _title: 'Button Style Guide'
    _controller: '\Drupal\carlson_styleguide\Controller\StyleguideController::buttons'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: FALSE

