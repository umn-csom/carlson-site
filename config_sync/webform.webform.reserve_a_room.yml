id: reserve_a_room
title: 'Reserve a Room'
description: ''
category: ''
elements: |-
  requester:
    '#type': textfield
    '#title': Requester
    '#required': true
  campus_or_mailing_address:
    '#type': textarea
    '#title': 'Campus or Mailing Address'
    '#required': true
  email_address:
    '#type': email
    '#title': 'Email address'
    '#required': true
  u_of_m_dept_or_external_entity:
    '#type': textfield
    '#title': 'U of M Dept. or External Entity'
    '#required': true
  if_u_of_m_efs_number_fund_deptid_program_required:
    '#type': textfield
    '#title': 'If U of M, EFS Number (Fund-DeptID-Program) Required'
    '#required': true
  phone_000_000_0000_:
    '#type': tel
    '#title': 'Phone (000-000-0000)'
    '#required': true
  event_title:
    '#type': textarea
    '#title': 'Event Title'
    '#required': true
  event_type:
    '#type': select
    '#title': 'Event Type'
    '#options':
      conference: Conference
      'information session': 'Information Session'
      meeting: Meeting
      orientation: Orientation
      seminar: Seminar
      speaker: Speaker
      'staff training': 'Staff Training'
      workshop: Workshop
      other: Other
    '#required': true
  event_description:
    '#type': textarea
    '#title': 'Event Description'
    '#required': true
  estimated_number_of_attendees:
    '#type': textfield
    '#title': 'Estimated Number of Attendees'
    '#required': true
  classrooms_and_spaces:
    '#type': fieldset
    '#title': 'Classrooms and Spaces'
    select_all_rooms_that_apply:
      '#type': select
      '#title': 'Select all rooms that apply'
      '#options':
        'first floor atrium': 'First Floor Atrium'
        1-114: '1-114 Classroom'
        '3M Auditorium': '1-115 (3M Auditorium)'
    executive_center_classrooms:
      '#type': select
      '#title': 'Executive Center Classrooms'
      '#options':
        2-260R: 2-260R
        2-260T: 2-260T
        2-260Z: 2-260Z
        '2-260 Foyer (Reception Space)': '2-260 Foyer (Reception Space)'
        2-206: 2-206
        2-207: '2-207 with Video Conferencing or Media Recording (addl fees)'
  event_start_date:
    '#type': date
    '#title': 'Event Start Date'
    '#required': true
    '#date_date_min': '-2 years'
    '#date_date_max': '+2 years'
  event_end_date:
    '#type': date
    '#title': 'Event End Date'
    '#required': true
    '#date_date_min': '-2 years'
    '#date_date_max': '+2 years'
  event_start_time:
    '#type': webform_time
    '#title': 'Event Start Time'
    '#required': true
  event_end_time:
    '#type': webform_time
    '#title': 'Event End Time'
    '#required': true
  additional_set_up_time:
    '#type': textfield
    '#title': 'Additional set up time'
  additional_take_down_clean_up_time:
    '#type': textfield
    '#title': 'Additional take down/clean up time'
  will_you_have_equipment_delivered_:
    '#type': select
    '#title': 'Will you have equipment delivered?'
    '#options':
      'yes': 'Yes'
      'no': 'No'
  will_refreshments_be_served_:
    '#type': select
    '#title': 'Will refreshments be served?'
    '#description': '(If yes, additional trash containers will be ordered. Standard quad containers are not intended for catering refuse.)'
    '#options':
      'yes': 'Yes'
      'no': 'No'
  please_provide_equipment_details:
    '#type': textarea
    '#title': 'Please provide equipment details'
  additional_information_and_comments_for_scheduler_include_info_r:
    '#type': textarea
    '#title': 'Additional information and comments for scheduler. (include info re breakout room or A/V needs if applicable)'
