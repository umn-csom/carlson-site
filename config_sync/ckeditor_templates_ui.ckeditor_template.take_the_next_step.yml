  value: "<div class=\"take-the-next-step\">\r\n<div class=\"take-the-next-step__title\">\r\n<h2>Take the next step</h2>\r\n</div>\r\n\r\n<div class=\"take-the-next-step__content\">\r\n<div class=\"take-the-next-step__summary\">\r\n<p>Apply early and give yourself the best chance to join the Carlson School's Full-Time MBA program.</p>\r\n</div>\r\n\r\n<div class=\"take-the-next-step__columns\">\r\n<div class=\"take-the-next-step__column take-the-next-step__column--first\">\r\n<p class=\"take-the-next-step__column__title\">Application Deadlines</p>\r\n\r\n<ul>\r\n\t<li>October 1</li>\r\n\t<li>December 1</li>\r\n\t<li>February 1</li>\r\n\t<li>April 1</li>\r\n\t<li>June 1 (domestic only)</li>\r\n</ul>\r\n</div>\r\n\r\n<div class=\"take-the-next-step__column take-the-next-step__column--second\"><a class=\"take-the-next-step__column__btn\" href=\"https://choose.umn.edu/apply/\" target=\"_blank\">Start an application</a> <a class=\"take-the-next-step__column__btn\" href=\"/degrees/master-business-administration/full-time-mba/admissions/admissions-requirements\">Admissions Requirements</a> <a class=\"take-the-next-step__column__btn\" data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"16ae5248-07cc-4fb1-a0f3-1d89c4a7fe4d\" href=\"/resources/prospective-graduate-students\" title=\"Resources for Prospective Graduate Students\">Application Tips</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n"
