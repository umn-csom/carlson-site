carlson_recaptcha.recaptcha_private_keys:
  path: '/admin/config/people/captcha/recaptcha-private-keys'
  defaults:
    _form: '\Drupal\carlson_recaptcha\Form\RecaptchaPrivateKeysForm'
    _title: 'reCAPTCHA private keys'
  requirements:
    _permission: 'administer CAPTCHA settings'
  options:
    _admin_route: TRUE
