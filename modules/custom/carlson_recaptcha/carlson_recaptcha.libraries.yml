# No core/drupal. header: true puts this in <head> so it is not queued behind
# heavy footer JavaScript; the script waits for DOMContentLoaded when needed.
v2_fallback_scroll:
  header: true
  js:
    js/carlson-recaptcha-v2-fallback-scroll.js:
      preprocess: false
      weight: -100

v2_fallback_chrome:
  css:
    theme:
      css/carlson-recaptcha-v2-fallback.css: {}
  js:
    js/carlson-recaptcha-v2-fallback.js: {}
  dependencies:
    - core/drupal
    - core/once

recaptcha_v3_accessibility_fix:
  js:
    js/recaptcha-v3-accessibility-fix.js: {}
  dependencies:
    - core/drupal
    - core/once
