mega_menu_2_col:
  label: Mega Menu - Two Column
  category: Mega Menu
  class: '\Drupal\carlson_megamenu_layouts\Plugin\Layout\MegaMenuWithImageColumn'
  theme_hook: mega_menu_2_col
  library: carlson_refresh/bootstrap_grid_cdn
  regions:
    heading:
      label: Heading
    image:
      label: Image
    col_1:
      label: Column 1
    col_2:
      label: Column 2
  icon_map:
  - [heading, heading, heading, image]
  - [col_1, col_2, col_2, image]
  - [col_1, col_2, col_2, image]

mega_menu_3_col:
  label: Mega Menu - Three Column
  category: Mega Menu
  class: '\Drupal\carlson_megamenu_layouts\Plugin\Layout\MegaMenuWithImageColumn'
  theme_hook: mega_menu_3_col
  library: carlson_refresh/bootstrap_grid_cdn
  regions:
    heading:
      label: Heading
    image:
      label: Image
    col_1:
      label: Column 1
    col_2:
      label: Column 2
    col_3:
      label: Column 3
  icon_map:
  - [heading, heading, heading, image]
  - [col_1, col_2, col_3, image]
  - [col_1, col_2, col_3, image]

