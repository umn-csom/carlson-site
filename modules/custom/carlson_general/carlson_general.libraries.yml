desktop_megamenu_ajax:
  # Leave this local JS library unversioned so Drupal includes the file content
  # hash in aggregate filenames and invalidates stale desktop menu assets.
  header: true
  js:
    js/desktop-megamenu-ajax.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once

