carlson_general.csv_import:
  path: "/admin/config/content/csv-import"
  defaults:
    _form: '\Drupal\carlson_general\Form\CSVImportForm'
    _title: "CSV Import"
  requirements:
    _permission: "access administration pages"

carlson_general.image_alt_check:
  path: "/admin/content/image-alt"
  defaults:
    _controller: '\Drupal\carlson_general\Controller\ImageAltCheckController::listMissingAlt'
    _title: "Missing Image Alt Text"
  requirements:
    _permission: "administer content"
