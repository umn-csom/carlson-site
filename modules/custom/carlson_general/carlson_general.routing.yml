carlson_general.csv_import:
  path: '/admin/config/content/csv-import'
  defaults:
    _form: '\Drupal\carlson_general\Form\CSVImportForm'
    _title: 'CSV Import'
  requirements:
    _permission: 'access administration pages'

carlson_general.carlson_scripts:
  path: '/admin/reports/carlson-scripts'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsController::content'
    _title: 'Carlson scripts'
  requirements:
    _permission: 'view reports'
  options:
    _admin_route: TRUE

carlson_general.view_file:
  path: '/admin/reports/carlson-scripts/view/{basename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsController::viewFile'
    _title: 'View File'
  requirements:
    _permission: 'view reports'

carlson_general.execute_script:
  path: '/admin/reports/carlson-scripts/execute/{basename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsController::executeScript'
    _title: 'Execute Script'
  requirements:
    _permission: 'view reports'

carlson_general.carlson_scripts_logs:
  path: '/admin/reports/carlson-scripts/logs'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsLogsController::content'
    _title: 'Logs'
  requirements:
    _permission: 'view reports'
  options:
    _admin_route: TRUE

carlson_general.logs_view_file:
  path: '/admin/reports/carlson-scripts/logs/view/{filename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsLogsController::viewFile'
    _title: 'View Log File'
  requirements:
    _permission: 'view reports'

carlson_general.logs_download_file:
  path: '/admin/reports/carlson-scripts/logs/download/{filename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsLogsController::downloadFile'
    _title: 'Download Log File'
  requirements:
    _permission: 'view reports'

carlson_general.download_csv:
  path: '/admin/reports/carlson-scripts/download/{basename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsController::downloadCsv'
    _title: 'Download CSV'
  requirements:
    _permission: 'view reports'

# AJAX endpoint that returns the live Webform separately from the cacheable
# node page shell.
carlson_general.deferred_webform:
  path: '/carlson-general/deferred-webform/{node}/{field_name}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\DeferredWebformController::load'
  requirements:
    _entity_access: 'node.view'
    field_name: '[a-z0-9_]+'
  options:
    parameters:
      node:
        type: entity:node

# Standalone non-JS fallback page for the same Webform so deferred loading
# does not make the form JavaScript-only.
carlson_general.deferred_webform_fallback:
  path: '/carlson-general/deferred-webform-fallback/{node}/{field_name}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\DeferredWebformController::fallback'
    _title: 'Form'
  requirements:
    _entity_access: 'node.view'
    field_name: '[a-z0-9_]+'
  options:
    parameters:
      node:
        type: entity:node

# AJAX endpoint that returns a paragraph-hosted Webform separately from the
# cacheable parent node page shell.
carlson_general.deferred_paragraph_webform:
  path: '/carlson-general/deferred-paragraph-webform/{paragraph}/{paragraph_revision}/{field_name}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\DeferredWebformController::loadParagraph'
  requirements:
    _access: 'TRUE'
    field_name: '[a-z0-9_]+'
  options:
    parameters:
      paragraph:
        type: entity:paragraph
      paragraph_revision:
        type: entity_revision:paragraph

# Standalone non-JS fallback page for the same paragraph-hosted Webform so
# deferred loading does not make the form JavaScript-only.
carlson_general.deferred_paragraph_webform_fallback:
  path: '/carlson-general/deferred-paragraph-webform-fallback/{paragraph}/{paragraph_revision}/{field_name}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\DeferredWebformController::fallbackParagraph'
    _title: 'Form'
  requirements:
    _access: 'TRUE'
    field_name: '[a-z0-9_]+'
  options:
    parameters:
      paragraph:
        type: entity:paragraph
      paragraph_revision:
        type: entity_revision:paragraph
