carlson_general.csv_import:
  path: '/admin/config/content/csv-import'
  defaults:
    _form: '\Drupal\carlson_general\Form\CSVImportForm'
    _title: 'CSV Import'
  requirements:
    _permission: 'access administration pages'

carlson_general.carlson_scripts:
  path: '/admin/reports/carlson-scripts'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsController::content'
    _title: 'Carlson scripts'
  requirements:
    _permission: 'view reports'
  options:
    _admin_route: TRUE

carlson_general.view_file:
  path: '/admin/reports/carlson-scripts/view/{basename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsController::viewFile'
    _title: 'View File'
  requirements:
    _permission: 'view reports'

carlson_general.execute_script:
  path: '/admin/reports/carlson-scripts/execute/{basename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsController::executeScript'
    _title: 'Execute Script'
  requirements:
    _permission: 'view reports'

carlson_general.carlson_scripts_logs:
  path: '/admin/reports/carlson-scripts/logs'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsLogsController::content'
    _title: 'Logs'
  requirements:
    _permission: 'view reports'
  options:
    _admin_route: TRUE

carlson_general.logs_view_file:
  path: '/admin/reports/carlson-scripts/logs/view/{filename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsLogsController::viewFile'
    _title: 'View Log File'
  requirements:
    _permission: 'view reports'

carlson_general.logs_download_file:
  path: '/admin/reports/carlson-scripts/logs/download/{filename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsLogsController::downloadFile'
    _title: 'Download Log File'
  requirements:
    _permission: 'view reports'

carlson_general.download_csv:
  path: '/admin/reports/carlson-scripts/download/{basename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\CarlsonScriptsController::downloadCsv'
    _title: 'Download CSV'
  requirements:
    _permission: 'view reports'

carlson_general.purge_trace_settings:
  path: '/admin/config/development/purge-trace'
  defaults:
    _form: '\Drupal\carlson_general\Form\PurgeTraceSettingsForm'
    _title: 'Purge trace'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE

carlson_general.purge_trace_report:
  path: '/admin/reports/purge-trace'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\PurgeTraceLogsController::content'
    _title: 'Purge trace'
  requirements:
    _permission: 'view reports'
  options:
    _admin_route: TRUE

carlson_general.purge_trace_view:
  path: '/admin/reports/purge-trace/view/{date}/{filename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\PurgeTraceLogsController::viewFile'
    _title: 'View purge trace file'
  requirements:
    _permission: 'view reports'

carlson_general.purge_trace_download:
  path: '/admin/reports/purge-trace/download/{date}/{filename}'
  defaults:
    _controller: '\Drupal\carlson_general\Controller\PurgeTraceLogsController::downloadFile'
    _title: 'Download purge trace file'
  requirements:
    _permission: 'view reports'
