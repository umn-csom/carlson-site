carlson_purge_trace.settings:
  path: '/admin/config/development/purge-trace'
  defaults:
    _form: '\Drupal\carlson_purge_trace\Form\PurgeTraceSettingsForm'
    _title: 'Purge trace'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE

carlson_purge_trace.report:
  path: '/admin/reports/purge-trace'
  defaults:
    _controller: '\Drupal\carlson_purge_trace\Controller\PurgeTraceLogsController::content'
    _title: 'Purge trace'
  requirements:
    _permission: 'view reports'
  options:
    _admin_route: TRUE

carlson_purge_trace.view:
  path: '/admin/reports/purge-trace/view/{date}/{filename}'
  defaults:
    _controller: '\Drupal\carlson_purge_trace\Controller\PurgeTraceLogsController::viewFile'
    _title: 'View purge trace file'
  requirements:
    _permission: 'view reports'

carlson_purge_trace.download:
  path: '/admin/reports/purge-trace/download/{date}/{filename}'
  defaults:
    _controller: '\Drupal\carlson_purge_trace\Controller\PurgeTraceLogsController::downloadFile'
    _title: 'Download purge trace file'
  requirements:
    _permission: 'view reports'

carlson_purge_trace.probe:
  path: '/admin/reports/purge-trace/probe'
  defaults:
    _controller: '\Drupal\carlson_purge_trace\Controller\PurgeTraceProbeController::run'
    _title: 'Purge trace validation probe'
  requirements:
    _permission: 'view reports'
  options:
    _admin_route: TRUE
