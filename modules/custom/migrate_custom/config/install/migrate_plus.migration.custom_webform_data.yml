id: custom_webform_data
label: UMN Carlson - Webforms Data Migration.
migration_group: custom

dependencies:
  enforced:
    module:
      - migrate_custom

source:
  plugin: custom_webform_data
  target: db_migration

process:
  sid: sid
  webform_id: webform_id
  uri: Webform_uri
  created: submitted
  completed: submitted
  changed: submitted
  in_draft: is_draft
  current_page: {}
  remote_addr: remote_addr
  uid: uid
  langcode:
    plugin: default_value
    default_value: 'en'    
  entity_type:
    plugin: default_value
    default_value: 'node'    
  entity_id: nid
  sticky: {}
  notes: {}
  serial: {}
  data: webform_data

destination:
  plugin: entity:webform_submission

migration_dependencies:
  required:
    - upgrade_d7_webform