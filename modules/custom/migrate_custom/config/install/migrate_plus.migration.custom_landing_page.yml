id: custom_landing_page
label: UMN Carlson - Landing Page Migration.
migration_group: custom

# define a forced module dependency. this will cause the migration definition to be reloaded
# when you uninstall and reinstall your custom module.
dependencies:
  enforced:
    module:
      - migrate_custom

source:
  plugin: custom_landing_page
  # The "target" here refers to the database connection where the source data lives.
  # You will need to configure this database in your settings.php.
  target: db_migration

destination:
  plugin: entity:node
  default_bundle: landing_page

process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky
  
  # Custom Fields
  'path/pathauto': 
    plugin: default_value
    default_value: 0 # Disable pathauto.
  'path/alias': alias
  field_news_channels: news_categories
  field_event_channels: event_category