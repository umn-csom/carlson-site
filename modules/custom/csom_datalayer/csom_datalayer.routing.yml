csom_datalayer.content:
  path: '/csom_datalayer_config'
  defaults:
    _controller: '\Drupal\csom_datalayer\Controller\CSOM_DataLayerController::content'
    _title: 'CSOM DataLayer Controller'
  requirements:
    _permission: 'access content'
csom_datalayer.settings_form:
  path: '/admin/config/system/csom_datalayer'
  defaults:
    _title: 'CSOM Data Layer Settings'
    _form: '\Drupal\csom_datalayer\Form\CSOMDataLayerSettingsForm'
  requirements:
    _permission: 'administer the csom data layer'
