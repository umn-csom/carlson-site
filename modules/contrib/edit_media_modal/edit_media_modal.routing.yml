edit_media_modal.get_id_by_uuid:
  path: '/edit-media-modal/edit-url/{uuid}'
  defaults:
    _controller: '\Drupal\edit_media_modal\Controller\EditMediaModalController::getEditUrl'
    _title: 'Edit media entity'
  requirements:
    _custom_access: '\Drupal\edit_media_modal\Controller\EditMediaModalController::access'

edit_media_modal.get_id_by_uuid.access_check:
  path: '/edit-media-modal/check-access/{uuid}'
  defaults:
    _controller: '\Drupal\edit_media_modal\Controller\EditMediaModalController::getEditUrlAccessCheck'
    _title: 'Edit media entity access'
  requirements:
    _access: 'TRUE'
