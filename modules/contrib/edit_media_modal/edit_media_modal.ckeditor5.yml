# The key for the plugin is MODULE_NAME_plugin. As plugins are ordered by key
# this plugin needs to be loaded after the media_media plugin so we need to
# be after it alphabetically.
# @todo - See if there is a better way to specify this order / dependency.
media_edit_media_modal:
  # Requires the media module.
  provider: media
  ckeditor5:
    plugins:
      - editMediaModal.EditMediaModal
    config:
      drupalMedia:
        toolbar: [editMediaButton]
      editMediaModal:
        openDialog:
          func:
            name: Drupal.ckeditor5.openDialog
            invoke: false
        dialogSettings:
          height: 75%
          dialogClass: edit-media-modal

  drupal:
    label: Edit Media Modal
    library: edit_media_modal/edit_media_modal_ckeditor5
    elements: false
    conditions:
      plugins:
        - media_media
