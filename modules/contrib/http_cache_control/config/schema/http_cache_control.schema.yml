http_cache_control.settings:
  type: config_object
  label: 'HTTP Cache-Control Settings'
  mapping:
    cache:
      type: mapping
      label: 'Cache Control'
      mapping:
        http:
          type: mapping
          label: 'Page caching'
          mapping:
            s_maxage:
              type: integer
              label: 'Shared cache max age'
            404_max_age:
              type: integer
              label: '404 max age'
            302_max_age:
              type: integer
              label: '302 max age'
            301_max_age:
              type: integer
              label: '301 max age'
            stale_while_revalidate:
              type: integer
              label: 'Stale while revalidate'
            stale_if_error:
              type: integer
              label: 'Stale if error'
            vary:
              type: string
              label: 'Vary'
            mustrevalidate:
              type: boolean
              label: 'Cache-Control: must-revalidate'
            nocache:
              type: boolean
              label: 'Cache-Control: no-cache'
            nostore:
              type: boolean
              label: 'Cache-Control: no-store'
        surrogate:
          type: mapping
          label: 'Surrogate-Control'
          mapping:
            maxage:
              type: integer
              label: 'Surrogate max age'
            nostore:
              type: boolean
              label: 'Surrogate no-store'
        targeted:
          type: mapping
          label: 'Targeted Cache-Control'
          mapping:
            items:
              type: sequence
              label: 'Targeted header definitions'
              sequence:
                type: mapping
                label: 'Targeted header'
                mapping:
                  target:
                    type: string
                    label: 'Target prefix (e.g. CDN, Akamai, Cloudflare-CDN)'
                  max_age:
                    type: integer
                    label: 'max-age (seconds)'
                  no_cache:
                    type: boolean
                    label: 'no-cache'
                  must_revalidate:
                    type: boolean
                    label: 'must-revalidate'
                  no_store:
                    type: boolean
                    label: 'no-store'
                  no_transform:
                    type: boolean
                    label: 'no-transform'
                  proxy_revalidate:
                    type: boolean
                    label: 'proxy-revalidate'
                  visibility:
                    type: string
                    label: 'public/private'
