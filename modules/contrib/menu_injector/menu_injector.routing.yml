entity.menu_injector_rule.order_form:
  path: '/admin/structure/menu-injector'
  defaults:
    _form: '\Drupal\menu_injector\Form\MenuInjectorOrderForm'
    _title: 'Menu Injector Configuration'
  requirements:
    _permission: 'administer_injector_permissions'

entity.menu_injector_rule.add_form:
  path: '/admin/structure/menu-injector/add'
  defaults:
    _entity_form: 'menu_injector_rule.default'
    _title: 'Add Menu Injector'
  requirements:
    _permission: 'administer_injector_permissions'

entity.menu_injector_rule.edit_form:
  path: '/admin/structure/menu-injector/{menu_injector_rule}'
  defaults:
    _entity_form: 'menu_injector_rule.default'
    _title: 'Edit Menu Injector'
  requirements:
    _permission: 'administer_injector_permissions'

entity.menu_injector_rule.delete_form:
  path: '/admin/structure/menu-injector/{menu_injector_rule}/delete'
  defaults:
    _entity_form: 'menu_injector_rule.delete'
    _title: 'Delete Menu Injector'
  requirements:
    _permission: 'administer_injector_permissions'

entity.menu_injector_rule.autocomplete:
  path: '/admin/structure/menu-injector/autocomplete/{field_name}'
  defaults:
    _controller: '\Drupal\menu_injector\Controller\AutocompleteController::handleAutocomplete'
    _format: json
  requirements:
    _access: 'TRUE'
    _permission: 'administer_injector_permissions'