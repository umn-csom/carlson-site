id: custom_blog
label: UMN Carlson - Blog Migration.
migration_group: custom

# define a forced module dependency. this will cause the migration definition to be reloaded
# when you uninstall and reinstall your custom module.
dependencies:
  enforced:
    module:
      - migrate_custom

source:
  plugin: custom_blog
  # The "target" here refers to the database connection where the source data lives.
  # You will need to configure this database in your settings.php.
  target: db_migration

destination:
  plugin: entity:node
  default_bundle: blog_entry

process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky
  
  # Custom Fields
  body: body
  'body/0/format':
     plugin: default_value
     default_value: rich_text
  'path/pathauto': 
    plugin: default_value
    default_value: 0 # Disable pathauto.
  'path/alias': alias
  field_blog_by_line: blog_by_line
  field_blog_group: type
  field_blog_categories: mba_blog_categories