id: custom_eep
label: UMN Carlson - Executive Ed Program Migration.
migration_group: custom

# define a forced module dependency. this will cause the migration definition to be reloaded
# when you uninstall and reinstall your custom module.
dependencies:
  enforced:
    module:
      - migrate_custom

source:
  plugin: custom_eep
  # The "target" here refers to the database connection where the source data lives.
  # You will need to configure this database in your settings.php.
  target: db_migration

destination:
  plugin: entity:node
  default_bundle: executive_ed_program

process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky
  
  # Custom Fields
  'path/pathauto': 
    plugin: default_value
    default_value: 0 # Disable pathauto.
  'path/alias': alias
  
  body: body
  'body/0/format':
     plugin: default_value
     default_value: rich_text
  field_ee_program_teaser: ee_program_teaser
  field_ee_business_topic: ee_business_topic
  field_ee_level: ee_level
  field_section: ec_section
  field_ee_business_challenge: ee_business_challeng
  field_ee_program_body: ee_program_body
  field_ee_program_audience: ee_program_audience
  field_ee_benefits: ee_takeaways
  field_ee_featured_faculty: ee_faculty
  field_ee_related_courses: ee_related_courses
  field_menu_rule: menu_position_rule
  field_ee_mili_program: mili_program