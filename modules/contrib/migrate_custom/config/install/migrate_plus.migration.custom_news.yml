id: custom_news
label: UMN Carlson - News Migration.
migration_group: custom

# define a forced module dependency. this will cause the migration definition to be reloaded
# when you uninstall and reinstall your custom module.
dependencies:
  enforced:
    module:
      - migrate_custom

source:
  plugin: custom_news
  # The "target" here refers to the database connection where the source data lives.
  # You will need to configure this database in your settings.php.
  target: db_migration

destination:
  plugin: entity:node
  default_bundle: news

process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky
  
  # Custom Fields
  field_in_the_media: news_in_the_media_link
  field_in_the_media_source: in_the_media_source
  field_sidebar_content: sidebar_content
  field_news_channels: news_categories
  
  # TODO: Unable to migrate List(text)
  # field_news_channel_features: featured_news
  # 'field_news_channel_features/value': featured_news
  # 'field_news_channel_features/key': featured_news

  body: body
  'body/0/format':
     plugin: default_value
     default_value: rich_text
  'path/pathauto': 
    plugin: default_value
    default_value: 0 # Disable pathauto.
  'path/alias': alias