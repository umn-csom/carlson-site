id: custom_faculty
label: UMN Carlson - Faculty Migration.
migration_group: custom

# define a forced module dependency. this will cause the migration definition to be reloaded
# when you uninstall and reinstall your custom module.
dependencies:
  enforced:
    module:
      - migrate_custom

source:
  plugin: custom_faculty
  # The "target" here refers to the database connection where the source data lives.
  # You will need to configure this database in your settings.php.
  target: db_migration

destination:
  plugin: entity:node
  default_bundle: faculty_profile

process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky
  
  # Custom Fields
  field_meta_tags: metatag
  field_first_name: first_name
  field_last_name: last_name
  field_profile_title: staff_title
  field_middle_initial: name_middle_initial
  field_profile_address: address_1
  'body/0/value': about_me
  'body/0/format':
     plugin: default_value
     default_value: rich_text
  field_profile_owner: faculty_profile_owner
  field_profile_dept: department
  field_email: faculty_email
  field_office_phone: office_phone
  field_profile_url: personal_url
  field_profile_job_candidate: faculty_job_candidate
  field_profile_admin_dept: faculty_department
  field_profile_programs: faculty_degree_program
  field_profile_status: faculty_status
  'path/pathauto': 
    plugin: default_value
    default_value: 0 # Disable pathauto.
  'path/alias': alias