id: custom_event
label: UMN Carlson - Event Migration.
migration_group: custom

# define a forced module dependency. this will cause the migration definition to be reloaded
# when you uninstall and reinstall your custom module.
dependencies:
  enforced:
    module:
      - migrate_custom

source:
  plugin: custom_event
  # The "target" here refers to the database connection where the source data lives.
  # You will need to configure this database in your settings.php.
  target: db_migration

destination:
  plugin: entity:node
  default_bundle: event

process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky
  
  # Custom Fields
  'path/pathauto': 
    plugin: default_value
    default_value: 0 # Disable pathauto.
  'path/alias': alias

  # Body
  body: event_description
  'body/0/format':
    plugin: default_value
    default_value: rich_text
  field_section: ec_section
  field_event_teaser: event_teaser
  field_event_id: event_id
  field_event_category: event_channels
  field_event_date: event_date
  field_event_cost: event_cost
  field_link: event_register
  field_google_map: google_map