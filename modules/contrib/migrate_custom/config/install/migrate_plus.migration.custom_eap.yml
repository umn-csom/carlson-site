id: custom_eap
label: UMN Carlson - Education Abroad Program Migration.
migration_group: custom

# define a forced module dependency. this will cause the migration definition to be reloaded
# when you uninstall and reinstall your custom module.
dependencies:
  enforced:
    module:
      - migrate_custom

source:
  plugin: custom_eap
  # The "target" here refers to the database connection where the source data lives.
  # You will need to configure this database in your settings.php.
  target: db_migration

destination:
  plugin: entity:node
  default_bundle: education_abroad_program

process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky
  
  # Custom Fields
  'path/pathauto':
    plugin: default_value
    default_value: 0 # Disable pathauto.
  'path/alias': alias

  field_section: ec_section
  field_short_sub_heading: ec_subheader
  field_ea_program_dates_info: ea_program_dates_info
  field_ea_program_status: ea_program_status
  field_ea_program_host_school: ea_program_host_school
  field_ea_program_location_info: ea_program_location_info
  field_ea_program_eligibility: ea_program_eligibility
  field_ea_program_academics: ea_program_academics
  field_ea_program_objective: ea_program_objective
  field_ea_program_schedule: ea_program_schedule
  field_ea_program_app_admission: ea_program_app_admission
  field_ea_program_housing_food: ea_program_housing_food
  field_ea_program_audience: ea_program_audience
  field_ea_program_predep_classes: ea_program_predep_classes
  field_visa_and_passport: visa_and_passport
  field_ea_program_business_exch: ea_program_business_exch
  field_ea_program_aid_scholarhips: ea_program_aid_scholarhips
  field_ea_cost_summary: ea_program_cost_estimate
  #field_ea_cost_table: ea_program_cost_table
  field_links: ea_links
  field_ea_terms: ea_terms
  field_ea_program_duration: ea_program_duration
  field_ea_program_degree_level: ea_program_degree_level
  field_ea_program_region: ea_program_region
  field_ea_program_country: ea_program_country
  field_ea_program_city: ea_program_city