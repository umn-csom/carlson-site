id: custom_student
label: UMN Carlson - Student Migration.
migration_group: custom

# define a forced module dependency. this will cause the migration definition to be reloaded
# when you uninstall and reinstall your custom module.
dependencies:
  enforced:
    module:
      - migrate_custom

source:
  plugin: custom_student
  # The "target" here refers to the database connection where the source data lives.
  # You will need to configure this database in your settings.php.
  target: db_migration

destination:
  plugin: entity:node
  default_bundle: student

process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky
  
  # Custom Fields
  'path/pathauto': 
    plugin: default_value
    default_value: 0 # Disable pathauto.
  'path/alias': alias

  body: body
  'body/0/format':
     plugin: default_value
     default_value: rich_text
  field_section: ec_section
  field_first_name: first_name
  field_last_name: last_name
  field_profile_featured: featured
  field_profile_quote: ec_pull_quote
  field_profile_undergrad: student_undergrad
  field_profile_carlson_activities: student_carlson_activities
  field_profile_hobbies: student_interests
  field_profile_intl: student_intl
  field_profile_favorite: favorite_thing_carlson
  field_profile_advice: advice_incoming_students
  field_profile_hometown: home
  field_profile_internship: student_internship
  field_profile_experience: student_experience